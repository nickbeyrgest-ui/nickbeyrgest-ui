name: Contribution snake

on:
  schedule:
    # Daily refresh after the contribution calendar settles (UTC).
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate both SVGs without pushing to snake-output"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  snake:
    name: Generate and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The only write scope needed: push the generated SVGs to snake-output.
      contents: write
    steps:
      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: nickbeyrgest-ui
          github_token: ${{ github.token }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=%23A97155&color_dots=%23E6E9E7,%23C9D6D3,%239FB3B1,%236E8380,%233F5350
            dist/snake-dark.svg?palette=github-dark&color_snake=%23C4A477&color_dots=%23121817,%231D2725,%232C3A37,%2345605B,%238FA6A3

      - name: Upload the generated SVGs for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contribution-snake
          path: dist/*.svg
          if-no-files-found: error
          retention-days: 7

      - name: Publish to the isolated snake-output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: snake-output
          build_dir: dist
          keep_history: false
          allow_empty_commit: false
          commit_message: "chore: refresh contribution snake"
          dry_run: ${{ inputs.dry_run == true }}
        env:
          # Built-in workflow token. No personal access token is used.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
