<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" role="img" aria-labelledby="title desc" focusable="false">
  <title id="title">Marvollo Studio — Independent Game Development</title>
  <desc id="desc">Animated title plate: the Marvollo Studio wordmark catches a slow pale-gold light while cold mist drifts across a dark shoreline backdrop.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C0B0A"/>
      <stop offset="0.55" stop-color="#151211"/>
      <stop offset="1" stop-color="#0A0908"/>
    </linearGradient>

    <radialGradient id="vignette" cx="50%" cy="44%" r="78%">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.42"/>
    </radialGradient>

    <linearGradient id="coldHaze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FA6A3" stop-opacity="0"/>
      <stop offset="0.68" stop-color="#8FA6A3" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#6E8380" stop-opacity="0.07"/>
    </linearGradient>

    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#C9D6D3" stop-opacity="0.20"/>
      <stop offset="0.42" stop-color="#9FB3B1" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#9FB3B1" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="mistGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8FA6A3" stop-opacity="0.12"/>
      <stop offset="0.65" stop-color="#8FA6A3" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#8FA6A3" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8D6B6"/>
      <stop offset="0.5" stop-color="#D5B58A"/>
      <stop offset="1" stop-color="#B98F63"/>
    </linearGradient>

    <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF4DC" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFF4DC" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFF4DC" stop-opacity="0"/>
    </linearGradient>

    <text id="wordmarkText" x="800" y="196" dx="9" text-anchor="middle" font-family="Cinzel, 'Trajan Pro', 'Times New Roman', Georgia, serif" font-size="108" font-weight="600" letter-spacing="18">MARVOLLO</text>

    <mask id="wordMask" maskUnits="userSpaceOnUse" x="0" y="70" width="1600" height="160">
      <use href="#wordmarkText" fill="#FFFFFF"/>
    </mask>

    <mask id="moonMask" maskUnits="userSpaceOnUse" x="1340" y="34" width="120" height="120">
      <circle cx="1404" cy="88" r="34" fill="#FFFFFF"/>
      <circle cx="1418" cy="78" r="34" fill="#000000"/>
    </mask>

    <style>
      .draw { stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw 2.4s cubic-bezier(0.22, 0.7, 0.22, 1) both; }
      .bracket-2 { animation-delay: 0.12s; }
      .bracket-3 { animation-delay: 0.24s; }
      .bracket-4 { animation-delay: 0.36s; }
      .sheen { animation: sheen 16s cubic-bezier(0.4, 0, 0.2, 1) 1.1s both; }
      .mist-a { animation: drift-a 36s ease-in-out 2 alternate; }
      .mist-b { animation: drift-b 48s ease-in-out 2 alternate; }
      .glow { animation: glow 14s ease-in-out infinite alternate; }
      .salt { animation: salt 28s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }

      @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
      @keyframes sheen { from { transform: translateX(0); } to { transform: translateX(2760px); } }
      @keyframes drift-a { from { transform: translateX(-22px); } to { transform: translateX(22px); } }
      @keyframes drift-b { from { transform: translateX(18px); } to { transform: translateX(-18px); } }
      @keyframes glow { from { opacity: 0.62; } to { opacity: 0.94; } }
      @keyframes salt { from { transform: translateY(0); opacity: 0.10; } to { transform: translateY(-14px); opacity: 0.34; } }

      @media (prefers-reduced-motion: reduce) {
        .draw, .sheen, .mist-a, .mist-b, .glow, .salt { animation: none !important; }
        .sheen { opacity: 0; }
        .draw { stroke-dashoffset: 0; }
        .salt { opacity: 0.22; }
      }

      @media (max-width: 600px) {
        .tagline { display: none; }
      }
    </style>
  </defs>

  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#coldHaze)"/>
  <rect width="1600" height="400" fill="url(#vignette)"/>

  <circle class="glow" cx="1404" cy="88" r="150" fill="url(#moonGlow)"/>
  <circle cx="1404" cy="88" r="34" fill="#C9D6D3" opacity="0.24" mask="url(#moonMask)"/>

  <ellipse class="mist-a" cx="380" cy="330" rx="540" ry="52" fill="url(#mistGrad)"/>
  <ellipse class="mist-b" cx="1190" cy="352" rx="640" ry="60" fill="url(#mistGrad)"/>

  <path class="draw" d="M120 362H1480" pathLength="1" stroke="#6E8380" stroke-opacity="0.13" stroke-width="1"/>

  <g fill="#C9D6D3">
    <circle class="salt" cx="208" cy="168" r="1.2" opacity="0.22"/>
    <circle class="salt" cx="316" cy="252" r="1" opacity="0.18" style="animation-duration: 34s; animation-delay: -6s"/>
    <circle class="salt" cx="524" cy="118" r="0.9" opacity="0.16" style="animation-duration: 40s; animation-delay: -14s"/>
    <circle class="salt" cx="972" cy="92" r="0.8" opacity="0.14" style="animation-duration: 31s; animation-delay: -3s"/>
    <circle class="salt" cx="1128" cy="318" r="1.1" opacity="0.20" style="animation-duration: 37s; animation-delay: -21s"/>
    <circle class="salt" cx="1392" cy="212" r="1.3" opacity="0.22" style="animation-duration: 29s; animation-delay: -9s"/>
    <circle class="salt" cx="1466" cy="298" r="0.9" opacity="0.16" style="animation-duration: 42s; animation-delay: -17s"/>
  </g>

  <g fill="none" stroke="#A97155" stroke-opacity="0.55" stroke-width="1.2">
    <path class="draw" d="M40 96V40H96" pathLength="1"/>
    <path class="draw bracket-2" d="M1504 40H1560V96" pathLength="1"/>
    <path class="draw bracket-3" d="M1560 304V360H1504" pathLength="1"/>
    <path class="draw bracket-4" d="M96 360H40V304" pathLength="1"/>
  </g>

  <use href="#wordmarkText" fill="url(#goldFill)"/>
  <rect class="sheen" x="-420" y="70" width="420" height="160" fill="url(#sheenGrad)" mask="url(#wordMask)"/>

  <text x="800" y="242" dx="11" text-anchor="middle" font-family="Cinzel, 'Trajan Pro', 'Times New Roman', Georgia, serif" font-size="28" font-weight="400" letter-spacing="22" fill="#C4A477">STUDIO</text>

  <g fill="none" stroke="#A97155" stroke-opacity="0.62" stroke-width="1">
    <path d="M628 276H770"/>
    <path d="M830 276H972"/>
    <path d="M800 264L812 276L800 288L788 276Z"/>
  </g>
  <circle cx="800" cy="276" r="1.8" fill="#D5B58A"/>

  <text class="tagline" x="800" y="318" dx="2.75" text-anchor="middle" font-family="Lora, Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" letter-spacing="5.5" fill="#DDD3C5" opacity="0.78">INDEPENDENT GAME DEVELOPMENT</text>
</svg>
